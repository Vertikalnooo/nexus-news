name: Calendar smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python macro.py
