name: Dependency lock and audit
on: [pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip==25.2
      - run: pip install pip-tools==7.5.0 pip-audit==2.9.0
      - run: |
          git hash-object requirements-preview.lock | grep -Fx '6701ba86423020c0d2c35620a50f18a7405068f5'
          sha256sum requirements-preview.lock
          grep -F 'transformers==5.24.1' requirements-preview.lock
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dependency-lock
          path: requirements-preview.lock
          retention-days: 1
      - run: pip-audit --require-hashes --disable-pip -r requirements-preview.lock
      - run: bash scripts/prepare_preview.sh
      - run: .preview-venv/bin/python scripts/prepare_model.py
      - run: .preview-venv/bin/python e2e_preview.py
      - run: .preview-venv/bin/python editorial_sample.py
