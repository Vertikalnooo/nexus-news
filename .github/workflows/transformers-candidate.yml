name: Transformers candidate
on: [pull_request]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip==25.2 pip-tools==7.5.0 pip-audit==2.9.0
      - run: |
          sed 's/transformers==5.10.0/transformers==5.24.1/' requirements-preview.in > candidate.in
          pip-compile --allow-unsafe --generate-hashes --extra-index-url https://download.pytorch.org/whl/cpu -o candidate.lock candidate.in
          pip-audit --require-hashes --disable-pip -r candidate.lock
          python -m venv .candidate
          .candidate/bin/pip install --require-hashes -r candidate.lock
          .candidate/bin/python scripts/prepare_model.py
          .candidate/bin/python -m unittest -v
          .candidate/bin/python e2e_preview.py
